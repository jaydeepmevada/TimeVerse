<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="caseGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#E2E2DC"/>
      <stop offset="45%" stop-color="#8A8A82"/>
      <stop offset="85%" stop-color="#242422"/>
      <stop offset="100%" stop-color="#1C1C1A"/>
    </radialGradient>
    <radialGradient id="dialGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#1A2E22" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#141412"/>
    </radialGradient>
    <linearGradient id="strapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#242422"/>
      <stop offset="50%" stop-color="#2C2C28"/>
      <stop offset="100%" stop-color="#242422"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Soft Radial -->
  <rect width="400" height="400" fill="#FAF8F0" rx="20"/>

  <!-- Watch Straps (Top & Bottom) -->
  <path d="M 160 20 L 240 20 L 230 110 L 170 110 Z" fill="url(#strapGrad)"/>
  <path d="M 170 290 L 230 290 L 240 380 L 160 380 Z" fill="url(#strapGrad)"/>

  <!-- Outer Lugs & Crown -->
  <rect x="290" y="188" width="18" height="24" rx="4" fill="#8A8A82"/>
  <rect x="286" y="150" width="12" height="16" rx="3" fill="#68B800" opacity="0.8"/>
  <rect x="286" y="234" width="12" height="16" rx="3" fill="#68B800" opacity="0.8"/>

  <!-- Bezel / Case -->
  <circle cx="200" cy="200" r="105" fill="url(#caseGrad)" filter="url(#dropShadow)"/>
  <circle cx="200" cy="200" r="95" fill="#1C1C1A" stroke="#68B800" stroke-width="2"/>
  
  <!-- Dial Face -->
  <circle cx="200" cy="200" r="86" fill="url(#dialGrad)"/>

  <!-- Hour Markers -->
  <line x1="200" y1="122" x2="200" y2="132" stroke="#68B800" stroke-width="4" stroke-linecap="round"/>
  <line x1="200" y1="268" x2="200" y2="278" stroke="#68B800" stroke-width="4" stroke-linecap="round"/>
  <line x1="122" y1="200" x2="132" y2="200" stroke="#68B800" stroke-width="4" stroke-linecap="round"/>
  <line x1="268" y1="200" x2="278" y2="200" stroke="#68B800" stroke-width="4" stroke-linecap="round"/>

  <!-- Sub-dial Rings -->
  <circle cx="170" cy="200" r="16" fill="none" stroke="#8A8A82" stroke-width="1.5" opacity="0.6"/>
  <circle cx="230" cy="200" r="16" fill="none" stroke="#8A8A82" stroke-width="1.5" opacity="0.6"/>
  <circle cx="200" cy="225" r="16" fill="none" stroke="#68B800" stroke-width="1.5" opacity="0.8"/>

  <!-- Time Hands -->
  <line x1="200" y1="200" x2="165" y2="160" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="200" y1="200" x2="245" y2="145" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="200" y1="200" x2="200" y2="130" stroke="#68B800" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="200" cy="200" r="6" fill="#68B800" stroke="#1C1C1A" stroke-width="2"/>

  <!-- Brand Label -->
  <text x="200" y="165" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#FFFFFF">TIMEVERSE</text>
  <text x="200" y="177" text-anchor="middle" font-family="'Inter', sans-serif" font-size="7" letter-spacing="1" fill="#68B800">AUTOMATIC</text>

  <!-- Title Badge -->
  <rect x="60" y="340" width="280" height="26" rx="13" fill="#1C1C1A" opacity="0.9"/>
  <text x="200" y="357" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="11" font-weight="600" fill="#F3F0E5">Submariner Case Profile</text>
</svg>
