version: '3.8'

services:
  timeverse-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: timeverse-mssql
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=TimeVerse@P@ssw0rd2026!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'TimeVerse@P@ssw0rd2026!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - timeverse-network

  timeverse-web:
    image: timeverse:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: timeverse-app
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DatabaseProvider=SqlServer
      - ConnectionStrings__DefaultConnection=Server=timeverse-db,1433;Database=TimeVerseDb;User Id=sa;Password=TimeVerse@P@ssw0rd2026!;TrustServerCertificate=True;MultipleActiveResultSets=true
      - ASPNETCORE_URLS=http://+:8080
    ports:
      - "5000:8080"
    depends_on:
      timeverse-db:
        condition: service_healthy
    volumes:
      - timeverse-uploads:/app/wwwroot/images/uploads
    networks:
      - timeverse-network

volumes:
  mssql-data:
    driver: local
  timeverse-uploads:
    driver: local

networks:
  timeverse-network:
    driver: bridge
